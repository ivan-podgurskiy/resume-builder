# Add this server block to /etc/nginx/sites-available/ivanpodgurskiy.name
# Place the upstream directive with other upstreams, and the server block with other server blocks.

# Add to upstream section (with website, n8n, metabase):
upstream resume {
    server 127.0.0.1:4000;
}

# Add to HTTP redirect server (server_name line):
#    resume.ivanpodgurskiy.name

# Add this server block for HTTPS:
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name resume.ivanpodgurskiy.name;

    ssl_certificate /etc/letsencrypt/live/ivanpodgurskiy.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ivanpodgurskiy.name/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/resume_access.log;
    error_log /var/log/nginx/resume_error.log;

    proxy_connect_timeout 60;
    proxy_send_timeout 60;
    proxy_read_timeout 60;

    location / {
        proxy_pass http://resume;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
