# Production docker-compose for VPS deployment
# Deploy to: resume.ivanpodgurskiy.name
# Services bind to 127.0.0.1 - Nginx proxies to frontend on port 4000

services:
  postgres:
    image: postgres:16-alpine
    container_name: resume-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: resume_builder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resume-network

  redis:
    image: redis:7-alpine
    container_name: resume-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resume-network

  backend:
    build:
      context: ./resume-backend
      dockerfile: Dockerfile.runtime
    container_name: resume-backend
    restart: always
    env_file:
      - ./resume-backend/.env
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/resume_builder?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=production
      - CORS_ORIGINS=https://resume.ivanpodgurskiy.name
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resume-network

  frontend:
    build:
      context: ./resume-frontend
      dockerfile: Dockerfile.runtime
    container_name: resume-frontend
    restart: always
    ports:
      - "127.0.0.1:4000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - resume-network

volumes:
  postgres_data:
  redis_data:

networks:
  resume-network:
    driver: bridge
